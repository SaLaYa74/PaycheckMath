<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@500;600&display=block" rel="stylesheet">
<style>
body{margin:0;background:#0E1612;color:#F2F7F4;font-family:Inter,sans-serif;width:1500px;height:620px;display:flex;flex-direction:column;align-items:center}
h1{font-family:"Barlow Condensed";font-size:48px;margin:28px 0 22px}
.row{display:flex;gap:40px}
.c{display:flex;flex-direction:column;align-items:center;gap:16px}
.circ{width:300px;height:300px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 42%,#1A3326,#0B1410 72%);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #23382D}
.l{font-family:"Barlow Condensed";font-size:30px;color:#3DDC84}
.d{color:#8FA89A;font-size:17px;margin-top:-10px}
</style></head><body>
<h1>PAYCHECK MATH · PROFILE PICTURE OPTIONS (circle preview)</h1>
<div class="row">

<div class="c"><div class="circ"><svg width="230" height="230" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="40" fill="#E8B84A" stroke="#0B1410" stroke-width="3"/>
  <circle cx="50" cy="50" r="33" fill="none" stroke="#B88A2A" stroke-width="2"/>
  <text x="50" y="62" text-anchor="middle" font-family="Barlow Condensed" font-weight="800" font-size="34" fill="#0B1410">PM</text>
  <polyline points="20,78 38,64 50,70 80,40" fill="none" stroke="#3DDC84" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="86,33 74,36 83,46" fill="#3DDC84"/></svg></div>
  <div class="l">A · The Coin</div><div class="d">PM coin + rising arrow</div></div>

<div class="c"><div class="circ"><svg width="230" height="230" viewBox="0 0 100 100">
  <text x="50" y="80" text-anchor="middle" font-family="Barlow Condensed" font-weight="800" font-size="92" fill="#F2F7F4">$</text>
  <polyline points="16,72 36,58 50,64 82,30" fill="none" stroke="#3DDC84" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="90,22 74,26 86,40" fill="#3DDC84"/></svg></div>
  <div class="l">B · Dollar Chart</div><div class="d">Bold $ with a chart line through it</div></div>

<div class="c"><div class="circ"><svg width="230" height="230" viewBox="0 0 100 100">
  <rect x="14" y="60" width="13" height="24" rx="2" fill="#3DDC84" opacity=".45"/>
  <rect x="31" y="48" width="13" height="36" rx="2" fill="#3DDC84" opacity=".7"/>
  <polygon points="47,54 68,34 89,54" fill="#E8B84A"/>
  <rect x="52" y="54" width="32" height="30" fill="#3DDC84"/><rect x="64" y="66" width="9" height="18" fill="#0B1410"/>
  <line x1="12" y1="84" x2="90" y2="84" stroke="#F2F7F4" stroke-width="3" stroke-linecap="round"/></svg></div>
  <div class="l">C · House Chart</div><div class="d">Bar chart that becomes a house</div></div>

<div class="c"><div class="circ" style="flex-direction:column;gap:2px">
  <div style="font-family:'Barlow Condensed';font-weight:800;font-size:92px;line-height:.82;color:#F2F7F4">PAY</div>
  <div style="font-family:'Barlow Condensed';font-weight:800;font-size:92px;line-height:.82;color:#3DDC84">CHECK</div>
  <div style="font-family:'Barlow Condensed';font-weight:800;font-size:46px;line-height:1;letter-spacing:6px;color:#E8B84A">= MATH</div></div>
  <div class="l">D · Wordmark</div><div class="d">Name only, bold stacked type</div></div>

</div></body></html>
