<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@500;600&display=block" rel="stylesheet">
<style>
body{margin:0;background:#0B1410;color:#F2F7F4;font-family:Inter,sans-serif;width:1240px;height:820px;display:flex;flex-direction:column;align-items:center}
h1{font-family:"Barlow Condensed";font-size:56px;margin:34px 0 4px}
.sub{color:#8FA89A;font-size:22px}
.row{display:flex;gap:56px;margin-top:26px}
.card{width:520px;background:#122019;border:2px solid #23382D;border-radius:28px;display:flex;flex-direction:column;align-items:center;padding:26px 0}
.card h2{font-family:"Barlow Condensed";font-size:42px;margin:14px 0 2px;color:#3DDC84}
.card p{margin:0;color:#8FA89A;font-size:20px}
.mini{display:flex;gap:16px;align-items:center;margin-top:16px;color:#8FA89A;font-size:16px}
</style></head><body>
<h1>PAYCHECK MATH · <span style="color:#3DDC84">MASCOT SKETCHES</span></h1>
<div class="sub">Same family as Digit (geometric, flat, glasses) · large + corner size</div>
<div class="row">

<div class="card">
<svg width="300" height="300" viewBox="0 0 200 200">
  <!-- tail: big curl that doubles as a rising chart line -->
  <path d="M150 170 C190 150 196 96 170 70 C150 50 128 62 136 84" fill="none" stroke="#B5652B" stroke-width="26" stroke-linecap="round"/>
  <polyline points="128,150 146,128 160,138 182,104" fill="none" stroke="#3DDC84" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="190,92 172,99 186,113" fill="#3DDC84"/>
  <!-- ears -->
  <polygon points="52,40 72,82 40,84" fill="#C8743A"/><polygon points="54,52 66,78 46,80" fill="#7A3E18"/>
  <polygon points="128,40 108,82 140,84" fill="#C8743A"/><polygon points="126,52 114,78 134,80" fill="#7A3E18"/>
  <!-- head -->
  <ellipse cx="90" cy="112" rx="56" ry="50" fill="#C8743A"/>
  <ellipse cx="90" cy="132" rx="34" ry="26" fill="#F4E3CF"/>
  <!-- glasses -->
  <circle cx="68" cy="106" r="15" fill="rgba(255,255,255,.18)" stroke="#0B1410" stroke-width="5"/>
  <circle cx="112" cy="106" r="15" fill="rgba(255,255,255,.18)" stroke="#0B1410" stroke-width="5"/>
  <line x1="83" y1="104" x2="97" y2="104" stroke="#0B1410" stroke-width="5"/>
  <circle cx="68" cy="107" r="5" fill="#0B1410"/><circle cx="112" cy="107" r="5" fill="#0B1410"/>
  <ellipse cx="90" cy="124" rx="7" ry="5" fill="#0B1410"/>
  <!-- buck teeth + acorn coin -->
  <rect x="84" y="134" width="12" height="10" rx="2" fill="#fff" stroke="#0B1410" stroke-width="2"/>
  <circle cx="44" cy="166" r="20" fill="#E8B84A" stroke="#0B1410" stroke-width="4"/>
  <text x="44" y="174" text-anchor="middle" font-family="Barlow Condensed" font-weight="800" font-size="24" fill="#0B1410">$</text>
</svg>
<h2>A · The Saver (Squirrel)</h2><p>Saves for later · tail is a rising chart · holds a coin</p>
<div class="mini"><svg width="56" height="56" viewBox="0 0 200 200"><use href="#none"/></svg></div>
</div>

<div class="card">
<svg width="300" height="300" viewBox="0 0 200 200">
  <!-- flat tail with grid like a spreadsheet -->
  <rect x="128" y="120" width="60" height="48" rx="14" fill="#5A3A22" transform="rotate(-18 158 144)"/>
  <g stroke="#3B2614" stroke-width="3" transform="rotate(-18 158 144)">
    <line x1="140" y1="122" x2="140" y2="166"/><line x1="158" y1="122" x2="158" y2="166"/><line x1="176" y1="122" x2="176" y2="166"/>
    <line x1="130" y1="138" x2="186" y2="138"/><line x1="130" y1="152" x2="186" y2="152"/></g>
  <!-- ears -->
  <circle cx="50" cy="66" r="14" fill="#8A5A34"/><circle cx="130" cy="66" r="14" fill="#8A5A34"/>
  <circle cx="50" cy="66" r="7" fill="#5A3A22"/><circle cx="130" cy="66" r="7" fill="#5A3A22"/>
  <!-- head -->
  <rect x="34" y="62" width="112" height="104" rx="48" fill="#8A5A34"/>
  <ellipse cx="90" cy="134" rx="36" ry="26" fill="#D9B48C"/>
  <!-- glasses -->
  <circle cx="68" cy="104" r="15" fill="rgba(255,255,255,.18)" stroke="#0B1410" stroke-width="5"/>
  <circle cx="112" cy="104" r="15" fill="rgba(255,255,255,.18)" stroke="#0B1410" stroke-width="5"/>
  <line x1="83" y1="102" x2="97" y2="102" stroke="#0B1410" stroke-width="5"/>
  <circle cx="68" cy="105" r="5" fill="#0B1410"/><circle cx="112" cy="105" r="5" fill="#0B1410"/>
  <ellipse cx="90" cy="124" rx="9" ry="6" fill="#0B1410"/>
  <!-- big teeth -->
  <rect x="80" y="134" width="10" height="14" rx="2" fill="#fff" stroke="#0B1410" stroke-width="2"/>
  <rect x="90" y="134" width="10" height="14" rx="2" fill="#fff" stroke="#0B1410" stroke-width="2"/>
  <!-- little house -->
  <polygon points="24,160 46,140 68,160" fill="#3DDC84"/><rect x="30" y="160" width="32" height="22" fill="#3DDC84"/>
  <rect x="42" y="166" width="9" height="16" fill="#0B1410"/>
</svg>
<h2>B · The Builder (Beaver)</h2><p>Builds wealth · spreadsheet tail · holds a house</p>
<div class="mini"></div>
</div>

</div></body></html>
