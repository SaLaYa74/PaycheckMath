name: Refresh Instagram token

on:
  schedule:
    - cron: "0 12 * * 1"   # Mondays
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh and store
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::GH_PAT secret is missing"; exit 1; fi
          NEW=$(python -c "import os; from pm.instagram import refresh_token as r; t,e=r(os.environ['IG_TOKEN']); print(t)")
          echo "::add-mask::$NEW"
          printf '%s' "$NEW" | gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY"
          echo "Token refreshed"
